name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish

      - name: install mcp-publisher
        run: >
          curl -sL
          https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          | tar xz mcp-publisher
      # The registry rejects a server.json whose version does not match the
      # package it points at, so take both from the tag rather than trusting
      # the checked-in value to have been bumped.
      - name: take the version from the tag
        run: |
          v=${GITHUB_REF#refs/tags/v}
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > tmp
          mv tmp server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
